name: melodia
description: "Melodía: app de música local + exploración en YouTube (streaming oficial), favoritos, playlists y personalización visual."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # Estado / arquitectura
  provider: ^6.1.2

  # Reproducción de audio local + segundo plano / notificación
  just_audio: ^0.9.40
  audio_service: ^0.18.15
  audio_session: ^0.1.21
  on_audio_query_pluse: ^3.0.7

  # Búsqueda + reproducción oficial de YouTube (streaming, no descarga).
  # `youtube_player_flutter` se incorporará en el hito H4 (trae
  # flutter_inappwebview y rompe el build con el AGP actual en este hito).
  youtube_explode_dart: ^3.1.0
  http: ^1.2.1
  url_launcher: ^6.2.5
  webview_flutter: ^4.8.0

  # Barra de progreso personalizable
  audio_video_progress_bar: ^2.0.3

  # Persistencia local (favoritos, playlists, ajustes, stats)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2

  # Personalización visual (imagen de fondo, selector de color, fuentes)
  image_picker: ^1.1.2
  flex_color_picker: ^3.5.1
  google_fonts: ^6.2.1
  carousel_slider: ^5.0.0

  # Permisos (leer archivos de música en el dispositivo)
  permission_handler: ^11.3.1

  # Utilidades de diseño y formato
  font_awesome_flutter: ^10.7.0
  flutter_spinkit: ^5.2.0
  intl: ^0.20.2
  path_provider: ^2.1.4

  # Color dominante de carátulas (luz ambiental del reproductor)
  image: ^4.3.0
  palette_generator: ^0.3.3+7

  # Anuncios
  google_mobile_ads: ^9.1.0

  # Acordes (diagramas guitarra/ukulele)
  chord_diagrams: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#080B12"
  adaptive_icon_foreground: "assets/images/icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true